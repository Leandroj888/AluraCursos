spring.application.name=ecomart

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# Utiliza o Ollama como provedor de chat.
spring.ai.model.chat=ollama
spring.ai.ollama.base-url: http://localhost:11434
spring.ai.ollama.chat.model: qwen3:4b
spring.ai.ollama.chat.temperature: 0.7
spring.ai.retry.max-attempts=1


# Utiliza a integração OpenAI para geração de imagens.
spring.ai.model.image=openai
spring.ai.openai.base-url=http://127.0.0.1:8000/v1
spring.ai.openai.api-key=local-key
spring.ai.openai.image.model=sd15
spring.ai.openai.image.response-format=b64_json