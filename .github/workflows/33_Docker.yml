name: Docker

on: 
  workflow_call:

jobs:
  docker_33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup DockerBuild
        uses: docker/setup-buildx-action@v3.12.0

      - name: Docker Login 
        uses: docker/login-action@v3.7.0 
        with: 
          username: ${{secrets.DOCKER_LOGIN_USER}}
          password: ${{secrets.DOCKER_LOGIN_PASSWORD}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6.19.2
        with:
          context: ./33_Integracao_Continua_Pipeline_Docker_no_Github_Actions
          file: ./33_Integracao_Continua_Pipeline_Docker_no_Github_Actions/Dockerfile
          push: true
          # nome do usuario/nome_imagem:versao (no caso o git pega o nome da branch)
          tags: leandrojunges/aluracursos_33_go_ci:${{github.ref_name}}
