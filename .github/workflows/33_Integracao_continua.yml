name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test_33:
    runs-on: ${{ matrix.os }}
    env:
      HOST: localhost 
      PORT: 5432
      USER: root 
      PASSWORD: root 
      DBNAME: root
    defaults:
      run:
        working-directory: "33_Integracao_Continua_Pipeline_Docker_no_Github_Actions"

    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose -f docker-compose.yml build
      
    - name: Create-DB
      run: docker compose -f docker-compose.yml up -d

    - name: Wait-DB
      run: |
        for i in {1..30}; do
          docker compose exec -T postgres pg_isready -U root -d root && exit 0
          sleep 2
        done
        docker compose logs postgres
        exit 1

    - name: Test
      run: go test -v main_test.go 
      
  
  build_33:
    needs: test_33
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: "33_Integracao_Continua_Pipeline_Docker_no_Github_Actions"
        
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go

  docker:
    needs: build_33
    uses: ./.github/workflows/33_Docker.yml
